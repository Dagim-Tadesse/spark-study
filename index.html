<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Spark Study</title>
    <meta name="description" content="Spark Study" />

    <meta property="og:title" content="Spark Study" />
    <meta property="og:description" content="Spark Study" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="splash">
      <div class="splash-inner">
        <div class="splash-spinner" aria-hidden="true"></div>
        <div class="splash-text">Loading Spark Study…</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <style>
      /* Minimal splash styles placed inline so they show before CSS loads */
      #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg,#0b1220);color:#fff;z-index:9999}
      .splash-inner{display:flex;flex-direction:column;align-items:center;gap:12px}
      .splash-spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,0.12);border-top-color:rgba(255,255,255,0.9);border-radius:50%;animation:spin 1s linear infinite}
      .splash-text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; font-weight:600; font-size:14px; color:rgba(255,255,255,0.95)}
      @keyframes spin{to{transform:rotate(360deg)}}
      .splash-fade{opacity:0;transition:opacity .32s ease}
    </style>
  </body>
</html>
